name: "tools: check release"

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check for new release
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: write
    steps:
      # Only the latest upstream version is released: the Release workflow
      # moves this tier's floating tags unconditionally, so backfilling
      # older versions would point them backwards. The Release workflow
      # creates the repository tag once it succeeds, so a failed release is
      # retried on the next run.
      - name: Dispatch new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(curl -fsS 'http://dl.google.com/android/cli/latest/debian/dists/stable/main/binary-amd64/Packages' | grep -oP '^Version: \K.*')
          if [ -z "$latest" ]; then
            echo "::error::Could not determine the latest upstream version"
            exit 1
          fi
          if ! gh api "repos/$GH_REPO/git/ref/tags/tools-$latest" --silent 2>/dev/null; then
            echo "Dispatching release for tools-$latest"
            gh workflow run release.yaml -f tier=tools -f version="$latest"
          fi
