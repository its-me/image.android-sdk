name: "tools: release"

on:
  push:
    tags:
      - 'tools-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK tools version number'
        required: true

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/tools-* ]]; then
            version="${GITHUB_REF_NAME#tools-}"
          else
            version="$INPUT_VERSION"
          fi
          echo "value=$version" >> $GITHUB_OUTPUT

  build:
    name: Build and push to GHCR
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: tools-${{ needs.resolve-version.outputs.version }} tools
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.tools
          build-args: ANDROID_SDK_TOOLS_VERSION=${{ needs.resolve-version.outputs.version }}
          push: true
          tags: |
            ghcr.io/its-me/android-sdk:tools-${{ needs.resolve-version.outputs.version }}
            ghcr.io/its-me/android-sdk:tools

  push-hub:
    name: Deploy to Docker Hub
    needs: build
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/android-sdk
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.build.outputs.tags }}

  push-quay:
    name: Deploy to Quay.io
    needs: build
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/android-sdk
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.build.outputs.tags }}
