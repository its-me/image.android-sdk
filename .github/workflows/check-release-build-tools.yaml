name: "build-tools: check release"

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check and tag new release
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Check and tag new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(curl -s 'https://dl.google.com/android/repository/repository2-3.xml' \
            | grep -oP 'build-tools;\K[0-9]+\.[0-9]+\.[0-9]+(?:-rc[0-9]+)?' \
            | sed 's/$/-z/' | sort -uV | tail -1 | sed 's/-z$//')
          if ! git ls-remote --exit-code origin "refs/tags/build-tools-$latest"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "build-tools-$latest" -m "build-tools-$latest"
            git push origin "build-tools-$latest"
            gh workflow run release.yaml -f tier=build-tools -f version="$latest"
          fi
