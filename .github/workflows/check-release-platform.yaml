name: "platform: check release"

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check for new release
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: write
    steps:
      # Only the latest upstream version is released: the Release workflow
      # moves this tier's floating tags unconditionally, so backfilling
      # older versions would point them backwards. The Release workflow
      # creates the repository tag once it succeeds, so a failed release is
      # retried on the next run.
      - name: Dispatch new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(curl -fsS 'https://dl.google.com/android/repository/repository2-3.xml' \
            | grep -oP 'platforms;android-\K[0-9]+(?:\.[0-9]+)?(?:-ext[0-9]+)?(?=")' \
            | sed 's/$/-z/' | sort -uV | tail -1 | sed 's/-z$//')
          if [ -z "$latest" ]; then
            echo "::error::Could not determine the latest upstream version"
            exit 1
          fi
          if ! gh api "repos/$GH_REPO/git/ref/tags/$latest" --silent 2>/dev/null; then
            echo "Dispatching release for $latest"
            gh workflow run release.yaml -f tier=platform -f version="$latest"
          fi
