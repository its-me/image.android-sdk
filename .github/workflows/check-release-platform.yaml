name: "platform: check release"

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check and tag new release
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Check and tag new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(curl -s 'https://dl.google.com/android/repository/repository2-3.xml' \
            | grep -oP 'platforms;android-\K[0-9]+(?:\.[0-9]+)?(?:-ext[0-9]+)?' \
            | sed 's/$/-z/' | sort -uV | tail -1 | sed 's/-z$//')
          if ! git ls-remote --exit-code origin "refs/tags/$latest"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$latest" -m "$latest"
            git push origin "$latest"
            gh workflow run release-platform.yaml -f version="$latest"
          fi
