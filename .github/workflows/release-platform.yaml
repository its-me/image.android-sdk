name: "platform: release"

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Platform version (e.g. 35, 35-ext14, 36.1 or 37.0)'
        required: true

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$INPUT_VERSION"
          fi
          echo "value=$version" >> $GITHUB_OUTPUT

  build:
    name: Build and push to GHCR
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.tags.outputs.bare }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          major="${VERSION%%.*}"
          bare="$VERSION"
          if [[ "$VERSION" != *"-ext"* ]]; then
            [[ "$major" != "$VERSION" ]] && bare="$bare $major"
            bare="$bare latest"
          fi
          echo "bare=$bare" >> $GITHUB_OUTPUT
          {
            echo "ghcr<<EOF"
            for t in $bare; do echo "ghcr.io/its-me/android-sdk:$t"; done
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: ANDROID_PLATFORM_VERSION=${{ needs.resolve-version.outputs.version }}
          push: true
          tags: ${{ steps.tags.outputs.ghcr }}

  push-hub:
    name: Deploy to Docker Hub
    needs: build
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/android-sdk
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.build.outputs.tags }}

  push-quay:
    name: Deploy to Quay.io
    needs: build
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/android-sdk
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.build.outputs.tags }}
