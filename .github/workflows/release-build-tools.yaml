name: "build-tools: release"

on:
  push:
    tags:
      - 'build-tools-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build tools version (e.g. 37.0.0 or 37.0.0-rc1)'
        required: true

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      major_tag: ${{ steps.version.outputs.major_tag }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/build-tools-* ]]; then
            version="${GITHUB_REF_NAME#build-tools-}"
          else
            version="$INPUT_VERSION"
          fi
          major="${version%%.*}"
          if [[ "$version" == *"-rc"* ]]; then
            rc="${version##*-}"
            major_tag="build-tools-${major}-${rc}"
          else
            major_tag="build-tools-${major}"
          fi
          echo "value=$version" >> $GITHUB_OUTPUT
          echo "major_tag=$major_tag" >> $GITHUB_OUTPUT

  build:
    name: Build and push to GHCR
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: build-tools-${{ needs.resolve-version.outputs.version }} ${{ needs.resolve-version.outputs.major_tag }} build-tools
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.build-tools
          build-args: ANDROID_BUILD_TOOLS_VERSION=${{ needs.resolve-version.outputs.version }}
          push: true
          tags: |
            ghcr.io/its-me/android-sdk:build-tools-${{ needs.resolve-version.outputs.version }}
            ghcr.io/its-me/android-sdk:${{ needs.resolve-version.outputs.major_tag }}
            ghcr.io/its-me/android-sdk:build-tools

  push-hub:
    name: Deploy to Docker Hub
    needs: build
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/android-sdk
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.build.outputs.tags }}

  push-quay:
    name: Deploy to Quay.io
    needs: build
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/android-sdk
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.build.outputs.tags }}
