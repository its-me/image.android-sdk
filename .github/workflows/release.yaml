name: Build and deploy

on:
  push:
    tags:
      - 'tools-*'
      - 'build-tools-*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to release'
        type: choice
        options: [tools, build-tools, platform]
        required: true
      version:
        description: 'Version for the selected tier (e.g. 14742923, 37.0.0, 35-ext14)'
        required: true

jobs:
  resolve:
    name: Resolve tier and version
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.resolve.outputs.tier }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tier and version
        id: resolve
        env:
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/tools-* ]]; then
            echo "tier=tools" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF_NAME#tools-}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/build-tools-* ]]; then
            echo "tier=build-tools" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF_NAME#build-tools-}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tier=platform" >> $GITHUB_OUTPUT
            echo "version=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          else
            echo "tier=$INPUT_TIER" >> $GITHUB_OUTPUT
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          fi

  build-tools:
    name: "tools: Build and push to GHCR"
    needs: resolve
    if: needs.resolve.outputs.tier == 'tools'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: tools-${{ needs.resolve.outputs.version }} tools
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.tools
          build-args: ANDROID_SDK_TOOLS_VERSION=${{ needs.resolve.outputs.version }}
          push: true
          tags: |
            ghcr.io/its-me/android-sdk:tools-${{ needs.resolve.outputs.version }}
            ghcr.io/its-me/android-sdk:tools

  push-tools-hub:
    name: "tools: Deploy to Docker Hub"
    needs: build-tools
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/android-sdk
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.build-tools.outputs.tags }}

  push-tools-quay:
    name: "tools: Deploy to Quay.io"
    needs: build-tools
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/android-sdk
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.build-tools.outputs.tags }}

  build-build-tools:
    name: "build-tools: Build and push to GHCR"
    needs: resolve
    if: needs.resolve.outputs.tier == 'build-tools'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: build-tools-${{ needs.resolve.outputs.version }} ${{ steps.tags.outputs.major_tag }} build-tools
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          major="${VERSION%%.*}"
          if [[ "$VERSION" == *"-rc"* ]]; then
            rc="${VERSION##*-}"
            major_tag="build-tools-${major}-${rc}"
          else
            major_tag="build-tools-${major}"
          fi
          echo "major_tag=$major_tag" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.build-tools
          build-args: ANDROID_BUILD_TOOLS_VERSION=${{ needs.resolve.outputs.version }}
          push: true
          tags: |
            ghcr.io/its-me/android-sdk:build-tools-${{ needs.resolve.outputs.version }}
            ghcr.io/its-me/android-sdk:${{ steps.tags.outputs.major_tag }}
            ghcr.io/its-me/android-sdk:build-tools

  push-build-tools-hub:
    name: "build-tools: Deploy to Docker Hub"
    needs: build-build-tools
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/android-sdk
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.build-build-tools.outputs.tags }}

  push-build-tools-quay:
    name: "build-tools: Deploy to Quay.io"
    needs: build-build-tools
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/android-sdk
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.build-build-tools.outputs.tags }}

  build-platform:
    name: "platform: Build and push to GHCR"
    needs: resolve
    if: needs.resolve.outputs.tier == 'platform'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.tags.outputs.bare }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          major="${VERSION%%.*}"
          bare="$VERSION"
          if [[ "$VERSION" != *"-ext"* ]]; then
            [[ "$major" != "$VERSION" ]] && bare="$bare $major"
            bare="$bare latest"
          fi
          echo "bare=$bare" >> $GITHUB_OUTPUT
          {
            echo "ghcr<<EOF"
            for t in $bare; do echo "ghcr.io/its-me/android-sdk:$t"; done
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: ANDROID_PLATFORM_VERSION=${{ needs.resolve.outputs.version }}
          push: true
          tags: ${{ steps.tags.outputs.ghcr }}

  push-platform-hub:
    name: "platform: Deploy to Docker Hub"
    needs: build-platform
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/android-sdk
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.build-platform.outputs.tags }}

  push-platform-quay:
    name: "platform: Deploy to Quay.io"
    needs: build-platform
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/android-sdk
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/android-sdk
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.build-platform.outputs.tags }}
